x-backend-common: &backend-common
  build: .
  env_file: .env
  restart: unless-stopped
  environment:
    - POSTGRES_HOST=postgres
    - REDIS_URL=redis://redis:6379/0
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '0.50'
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *backend-common
    command: >
      python -m alembic upgrade head &&
      uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend-common
    command: python -m celery -A apps.worker.celery_app worker --pool=prefork -l info -Q celery
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A apps.worker.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-exec:
    <<: *backend-common
    command: python -m celery -A apps.worker.celery_app worker --pool=prefork -l info -Q execution --concurrency=1
    deploy:
      resources:
        limits:
          memory: 1G  # Higher memory for heavy executions
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A apps.worker.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  beat:
    <<: *backend-common
    command: python -m celery -A apps.worker.celery_app beat -l info
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  indexer:
    <<: *backend-common
    command: python -m apps.indexer.main --loop
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m apps.indexer.main --loop' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

