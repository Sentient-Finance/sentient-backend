x-backend-common: &backend-common
  image: ghcr.io/sentient-finance/sentient-backend:latest
  build: .
  env_file: .env
  restart: unless-stopped
  environment:
    - POSTGRES_HOST=postgres
    - REDIS_URL=redis://redis:6379/0
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '0.50'
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    container_name: sentient-api
    <<: *backend-common
    command: >
      python -m alembic upgrade head &&
      uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentient-internal
      - npm_network

  worker:
    container_name: sentient-worker
    <<: *backend-common
    command: python -m celery -A apps.worker.celery_app worker --pool=prefork -l info -Q celery
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A apps.worker.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - sentient-internal

  worker-exec:
    container_name: sentient-worker-exec
    <<: *backend-common
    command: python -m celery -A apps.worker.celery_app worker --pool=prefork -l info -Q execution --concurrency=1
    deploy:
      resources:
        limits:
          memory: 1G  # Higher memory for heavy executions
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A apps.worker.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - sentient-internal

  beat:
    container_name: sentient-beat
    <<: *backend-common
    command: python -m celery -A apps.worker.celery_app beat -l info
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - sentient-internal

  postgres:
    container_name: sentient-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    container_name: sentient-redis
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  sentient-internal:
    driver: bridge
  npm_network:
    external: true

volumes:
  pgdata:
  redisdata:
