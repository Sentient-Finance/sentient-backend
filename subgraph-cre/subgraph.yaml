specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: VaultFactory
    network: base
    source:
      address: "0x00328fc9a60d429cc347e4cf59363077dd6ac73a"
      abi: VaultFactory
      startBlock: 42840032
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DefaultsUpdated
        - ExecutorUpdated
        - OwnershipTransferred
        - RelayerUpdated
        - VaultCreated
      abis:
        - name: VaultFactory
          file: ./abis/VaultFactory.json
      eventHandlers:
        - event: DefaultsUpdated(uint256,uint256)
          handler: handleDefaultsUpdated
        - event: ExecutorUpdated(indexed address,indexed address)
          handler: handleExecutorUpdated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: RelayerUpdated(indexed address,indexed address)
          handler: handleRelayerUpdated
        - event: VaultCreated(indexed address,indexed address,uint256)
          handler: handleVaultCreated
      file: ./src/vault-factory.ts
