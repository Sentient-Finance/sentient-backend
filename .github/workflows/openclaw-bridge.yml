name: OpenClaw GitHub Bridge

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, reopened, synchronize, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify-openclaw:
    # Always forward issue/PR lifecycle events.
    # For comment events, only forward when bot is mentioned.
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'pull_request' ||
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (
          contains(github.event.comment.body, '@Moltleadbot') ||
          contains(github.event.comment.body, '@moltleadbot') ||
          contains(github.event.comment.body, '@molt-dev-max')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Build payload JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          event_name = os.environ.get('GITHUB_EVENT_NAME', 'unknown')
          actor = os.environ.get('GITHUB_ACTOR', 'unknown')
          repo = os.environ.get('GITHUB_REPOSITORY', 'unknown')
          event_path = os.environ.get('GITHUB_EVENT_PATH')

          with open(event_path, 'r', encoding='utf-8') as f:
            ev = json.load(f)

          issue = ev.get('issue') or {}
          pr = ev.get('pull_request') or {}
          comment = ev.get('comment') or {}
          repository = ev.get('repository') or {}

          title = issue.get('title') or pr.get('title') or 'GitHub event'
          url = issue.get('html_url') or pr.get('html_url') or comment.get('html_url') or repository.get('html_url') or ''
          body = comment.get('body') or issue.get('body') or pr.get('body') or ''
          body = (body or '')[:1200]

          payload = {
            'name': 'GitHub',
            'message': f'[{event_name}] {repo} by @{actor}\nTitle: {title}\nURL: {url}\n\nContent:\n{body}',
            'deliver': True,
            'channel': 'telegram',
            'to': 'telegram:-1003257445528',
            'wakeMode': 'now'
          }

          with open('payload.json', 'w', encoding='utf-8') as f:
            json.dump(payload, f)
          PY

      - name: Send to OpenClaw hook
        env:
          OPENCLAW_HOOK_URL: ${{ secrets.OPENCLAW_HOOK_URL }}
          OPENCLAW_HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOK_TOKEN }}
        run: |
          test -n "$OPENCLAW_HOOK_URL"
          test -n "$OPENCLAW_HOOK_TOKEN"

          curl -f -sS -X POST "$OPENCLAW_HOOK_URL" \
            -H "Authorization: Bearer $OPENCLAW_HOOK_TOKEN" \
            -H "Content-Type: application/json" \
            --data @payload.json

      - name: Comment back in GitHub thread
        if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          BODY="✅ Nhận được mention, mình đã chuyển request sang OpenClaw (Telegram bridge).\n\nRef: $COMMENT_URL"
          jq -n --arg body "$BODY" '{body:$body}' > gh_comment.json
          curl -f -sS -X POST "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @gh_comment.json
